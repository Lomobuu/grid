name: Deploy Vendor Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version"
        required: true
        type: string
        default: "1.0.0"

      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - test
          - prod

permissions:
  id-token: write
  contents: read

env:
  STORAGE_ACCOUNT_NAME: stgridfozzentest
  CONTAINER_NAME: vendor-package

  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  prepare-package:
    name: Prepare Package
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download Package
        run: |
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --container-name "$CONTAINER_NAME" \
            --name "${{ inputs.version }}.zip" \
            --file package.zip \
            --auth-mode login

      - name: Extract Package
        run: |
          rm -rf vendor-package
          mkdir -p vendor-package
          unzip -q package.zip -d vendor-package

      - name: Replace Vendor tfvars
        run: |
          cp terraform/environments/${{ inputs.environment }}/vendor/ka.tfvars package/terraform/ka.tfvars

      - name: Upload Prepared Package
        uses: actions/upload-artifact@v4
        with:
          name: vendor-package
          path: .
          retention-days: 1

  security-scan:
    name: Security Scan
    needs: prepare-package
    runs-on: ubuntu-latest

    steps:
      - name: Download Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor-package

      #
      # Add your future checks here
      #
      # Examples:
      #
      # - uses: aquasecurity/tfsec-action
      # - uses: bridgecrewio/checkov-action
      #
      # - grep for forbidden providers
      # - check allowed modules
      # - validate package structure
      #

      - name: Security Scan Placeholder
        run: |
          echo "Package approved"

  terraform-plan:
    name: Terraform Plan
    needs: security-scan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Download Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor-package

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: package/terraform
        run: |
          terraform init \
            -input=false \
            -backend-config=../../terraform/backend-configs/backend-vendor-package-${{ inputs.environment }}.tfbackend

      - name: Terraform Validate
        working-directory: package/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: package/terraform
        run: |
          terraform plan \
            -input=false \
            -var-file=ka.tfvars \
            -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: package/terraform/tfplan
          retention-days: 1

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Download Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor-package

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: package/terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: package/terraform
        run: |
          terraform init \
            -input=false \
            -backend-config=../../terraform/backend-configs/backend-vendor-package-${{ inputs.environment }}.tfbackend

      - name: Terraform Apply
        working-directory: package/terraform
        run: |
          terraform apply \
            -input=false \
            tfplan