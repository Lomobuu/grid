name: Deploy Vendor Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        type: string
        default: "1.0.0"

permissions:
  id-token: write
  contents: read

env:
  STORAGE_ACCOUNT_NAME: stgridfozzentest
  CONTAINER_NAME: vendor-package

  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  prepare-package:
    name: Prepare Package
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download Package
        run: |
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --container-name "$CONTAINER_NAME" \
            --name "${{ inputs.version }}.zip" \
            --file package.zip \
            --auth-mode login

      - name: Extract Package
        run: |
          rm -rf package
          mkdir -p package
          unzip -q package.zip -d package

      - name: Upload Prepared Package
        uses: actions/upload-artifact@v4
        with:
          name: vendor-package
          path: package
          retention-days: 1

  security-scan:
    name: Security Scan
    needs: prepare-package
    runs-on: ubuntu-latest

    steps:
      - name: Download Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor-package
          path: package

      #
      # Add your future checks here.
      #
      # Examples:
      #
      # - uses: aquasecurity/tfsec-action
      # - uses: bridgecrewio/checkov-action
      #
      # - grep for forbidden providers
      # - check allowed modules
      # - validate package structure
      #

      - name: Security Scan Placeholder
        run: |
          echo "Package approved"

  terraform-plan-test:
    name: Terraform Plan - Test
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor-package
          path: package

      - name: Replace Vendor tfvars
        run: |
          cp \
            terraform/environments/test/vendor/ka.tfvars \
            package/terraform/ka.tfvars

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: package/terraform
        run: |
          terraform init \
            -input=false \
            -backend-config=../../terraform/backend-configs/backend-vendor-package-test.tfbackend

      - name: Terraform Validate
        working-directory: package/terraform
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: package/terraform
        run: |
          terraform plan \
            -input=false \
            -var-file=ka.tfvars \
            -out=tfplan

      - name: Upload Test Package
        uses: actions/upload-artifact@v4
        with:
          name: vendor-package-test
          path: package
          retention-days: 1

      - name: Upload Test Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-test
          path: package/terraform/tfplan
          retention-days: 1

      - name: Create Test Plan Summary
        shell: bash
        working-directory: package/terraform
        run: |
          tfplan="$(terraform show -no-color tfplan)"

          plan_summary="$(echo "$tfplan" | tail -2)"
          plan_import="$(echo "$plan_summary" | grep -oE '[0-9]+ to import' | grep -oE '[0-9]+' || echo "0")"
          plan_add="$(echo "$plan_summary" | grep -oE '[0-9]+ to add' | grep -oE '[0-9]+' || echo "0")"
          plan_change="$(echo "$plan_summary" | grep -oE '[0-9]+ to change' | grep -oE '[0-9]+' || echo "0")"
          plan_destroy="$(echo "$plan_summary" | grep -oE '[0-9]+ to destroy' | grep -oE '[0-9]+' || echo "0")"

          {
            echo "## Terraform Plan Summary - Test"
            echo
            echo "| Add ➕ | Change 🔄 | Destroy 🗑️ | Import 📥 |"
            echo "|---|---|---|---|"
            echo "| $plan_add | $plan_change | $plan_destroy | $plan_import |"
            echo
            echo "<details>"
            echo "<summary>Show Plan</summary>"
            echo
            echo '```terraform'
            echo "$tfplan"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "**Version:** \`${{ inputs.version }}\`"
            echo
            echo "**Environment:** \`test\`"
            echo
            echo "**Actor:** @$GITHUB_ACTOR"
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-plan-prod:
    name: Terraform Plan - Prod
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor-package
          path: package

      - name: Replace Vendor tfvars
        run: |
          cp \
            terraform/environments/prod/vendor/ka.tfvars \
            package/terraform/ka.tfvars

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: package/terraform
        run: |
          terraform init \
            -input=false \
            -backend-config=../../terraform/backend-configs/backend-vendor-package-prod.tfbackend

      - name: Terraform Validate
        working-directory: package/terraform
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: package/terraform
        run: |
          terraform plan \
            -input=false \
            -var-file=ka.tfvars \
            -out=tfplan

      - name: Upload Prod Package
        uses: actions/upload-artifact@v4
        with:
          name: vendor-package-prod
          path: package
          retention-days: 1

      - name: Upload Prod Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-prod
          path: package/terraform/tfplan
          retention-days: 1

      - name: Create Prod Plan Summary
        shell: bash
        working-directory: package/terraform
        run: |
          tfplan="$(terraform show -no-color tfplan)"

          plan_summary="$(echo "$tfplan" | tail -2)"
          plan_import="$(echo "$plan_summary" | grep -oE '[0-9]+ to import' | grep -oE '[0-9]+' || echo "0")"
          plan_add="$(echo "$plan_summary" | grep -oE '[0-9]+ to add' | grep -oE '[0-9]+' || echo "0")"
          plan_change="$(echo "$plan_summary" | grep -oE '[0-9]+ to change' | grep -oE '[0-9]+' || echo "0")"
          plan_destroy="$(echo "$plan_summary" | grep -oE '[0-9]+ to destroy' | grep -oE '[0-9]+' || echo "0")"

          {
            echo "## Terraform Plan Summary - Prod"
            echo
            echo "| Add ➕ | Change 🔄 | Destroy 🗑️ | Import 📥 |"
            echo "|---|---|---|---|"
            echo "| $plan_add | $plan_change | $plan_destroy | $plan_import |"
            echo
            echo "<details>"
            echo "<summary>Show Plan</summary>"
            echo
            echo '```terraform'
            echo "$tfplan"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "**Version:** \`${{ inputs.version }}\`"
            echo
            echo "**Environment:** \`prod\`"
            echo
            echo "**Actor:** @$GITHUB_ACTOR"
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-apply-test:
    name: Terraform Apply - Test
    needs: terraform-plan-test
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Test Package
        uses: actions/download-artifact@v4
        with:
          name: vendor-package-test
          path: package

      - name: Download Test Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-test
          path: package/terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: package/terraform
        run: |
          terraform init \
            -input=false \
            -backend-config=../../terraform/backend-configs/backend-vendor-package-test.tfbackend

      - name: Terraform Apply
        working-directory: package/terraform
        run: |
          terraform apply \
            -input=false \
            tfplan

  terraform-apply-prod:
    name: Terraform Apply - Prod
    needs: terraform-plan-prod
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Prod Package
        uses: actions/download-artifact@v4
        with:
          name: vendor-package-prod
          path: package

      - name: Download Prod Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-prod
          path: package/terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: package/terraform
        run: |
          terraform init \
            -input=false \
            -backend-config=../../terraform/backend-configs/backend-vendor-package-prod.tfbackend

      - name: Terraform Apply
        working-directory: package/terraform
        run: |
          terraform apply \
            -input=false \
            tfplan