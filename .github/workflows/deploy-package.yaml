name: Deploy Vendor Package

on:
  pull_request:
    branches:
      - main
    paths:
      - vendor-package/**
  workflow_dispatch:
    inputs:
      version:
        description: KA version (leave blank to use the newest package in the repo)
        required: false
        type: string
        default: "6.30.3582"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-vendor-package
  cancel-in-progress: false

env:
  # Vendor package zips live in this repository as
  # <PACKAGE_DIR>/<PACKAGE_PREFIX><version>.zip
  # e.g. vendor-package/KA-Terraform-ISO-6.30.3582.zip
  PACKAGE_DIR: vendor-package
  PACKAGE_PREFIX: KA-Terraform-ISO-

  TF_IN_AUTOMATION: true

  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  prepare-package:
    name: Prepare Package
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Needed so the base commit is available for the diff below.
          fetch-depth: 0

      - name: Resolve Package
        id: package
        env:
          VERSION: ${{ inputs.version }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$VERSION" ]]; then
            # Version given manually.
            zip_path="$PACKAGE_DIR/$PACKAGE_PREFIX$VERSION.zip"
          elif git rev-parse --verify --quiet "${BASE_SHA:-none}^{commit}" > /dev/null; then
            # PR or push: the newest package added in this change.
            zip_path="$(
              git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" -- "$PACKAGE_DIR" \
                | grep -E "/$PACKAGE_PREFIX.*\.zip$" \
                | sort -V | tail -1 || true
            )"
          fi

          # Nothing resolved above: take the newest package in the repo.
          if [[ -z "$zip_path" ]]; then
            zip_path="$(
              find "$PACKAGE_DIR" -maxdepth 1 -name "$PACKAGE_PREFIX*.zip" \
                | sort -V | tail -1
            )"
          fi

          if [[ ! -f "$zip_path" ]]; then
            echo "Package not found: $zip_path"
            echo "Available packages:"
            ls -1 "$PACKAGE_DIR" 2> /dev/null || echo "  (none)"
            exit 1
          fi

          version="$(basename "$zip_path" .zip)"
          version="${version#$PACKAGE_PREFIX}"

          echo "path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          {
            echo "## Package"
            echo
            echo "**Version:** \`$version\`"
            echo
            echo "**Source:** \`$zip_path\`"
            echo
            echo "**Commit:** \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Extract Package
        env:
          ZIP_PATH: ${{ steps.package.outputs.path }}
        run: |
          rm -rf package
          mkdir -p package
          unzip -q "$ZIP_PATH" -d package

      - name: Verify KA Terraform ISO Integrity
        run: |
          # The vendor ships _checksums.sha256; its paths are relative to it.
          checksums="$(find package -name _checksums.sha256 -print -quit)"
 
          if [[ -z "$checksums" ]]; then
            echo "No _checksums.sha256 found in the package."
            exit 1
          fi
 
          cd "$(dirname "$checksums")"
          sha256sum --check --quiet _checksums.sha256
 
          echo "Integrity verified against $checksums"

      - name: Upload Prepared Package
        uses: actions/upload-artifact@v4
        with:
          name: vendor-package
          path: package
          if-no-files-found: error
          retention-days: 1

  terraform-plan-test:
    name: Terraform Plan - Test
    needs: [prepare-package]
    runs-on: ubuntu-latest
    environment: test

    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor-package
          path: package

      - name: Replace Vendor tfvars
        run: |
          cp \
            terraform/environments/test/vendor/ka.tfvars \
            package/terraform/ka.tfvars

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: package/terraform
        run: |
          terraform init \
            -input=false \
            -backend-config=../../terraform/backend-configs/backend-vendor-package-test.tfbackend

      - name: Terraform Validate
        working-directory: package/terraform
        run: |
          terraform validate

      - name: Terraform Plan
        id: plan
        shell: bash {0}
        working-directory: package/terraform
        run: |
          terraform plan \
            -input=false \
            -detailed-exitcode \
            -var-file=ka.tfvars \
            -out=tfplan

          exitcode=$?

          if [[ "$exitcode" == "1" ]]; then
            echo "Terraform plan failed."
            exit 1
          fi

          if [[ "$exitcode" == "2" ]]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Test Package
        if: steps.plan.outputs.has-changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vendor-package-test
          path: package
          if-no-files-found: error
          retention-days: 1

      - name: Upload Test Terraform Plan
        if: steps.plan.outputs.has-changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-test
          path: package/terraform/tfplan
          if-no-files-found: error
          retention-days: 1

      - name: Create Test Plan Summary
        if: always() && steps.plan.outcome == 'success'
        shell: bash
        working-directory: package/terraform
        env:
          HAS_CHANGES: ${{ steps.plan.outputs.has-changes }}
          VERSION: ${{ needs.prepare-package.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$HAS_CHANGES" == "false" ]]; then
            {
              echo "## Terraform Plan Summary - Test"
              echo
              echo "✅ No infrastructure changes detected."
              echo
              echo "**Apply:** Skipped"
              echo
              echo "**Version:** \`$VERSION\`"
              echo
              echo "**Environment:** \`test\`"
              echo
              echo "**Actor:** @$GITHUB_ACTOR"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          tfplan="$(terraform show -no-color tfplan)"

          plan_summary="$(echo "$tfplan" | tail -2)"
          plan_import="$(echo "$plan_summary" | grep -oE '[0-9]+ to import' | grep -oE '[0-9]+' || echo "0")"
          plan_add="$(echo "$plan_summary" | grep -oE '[0-9]+ to add' | grep -oE '[0-9]+' || echo "0")"
          plan_change="$(echo "$plan_summary" | grep -oE '[0-9]+ to change' | grep -oE '[0-9]+' || echo "0")"
          plan_destroy="$(echo "$plan_summary" | grep -oE '[0-9]+ to destroy' | grep -oE '[0-9]+' || echo "0")"

          {
            echo "## Terraform Plan Summary - Test"
            echo
            echo "| Add ➕ | Change 🔄 | Destroy 🗑️ | Import 📥 |"
            echo "|---|---|---|---|"
            echo "| $plan_add | $plan_change | $plan_destroy | $plan_import |"
            echo
            echo "<details>"
            echo "<summary>Show Plan</summary>"
            echo
            echo '```terraform'
            echo "$tfplan"
            echo '```'
            echo
            echo "</details>"
            echo
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              echo "**Apply:** Skipped - plan only on pull requests"
            else
              echo "**Apply:** Pending"
            fi
            echo
            echo "**Version:** \`$VERSION\`"
            echo
            echo "**Environment:** \`test\`"
            echo
            echo "**Actor:** @$GITHUB_ACTOR"
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-plan-prod:
    name: Terraform Plan - Prod
    needs: [prepare-package]
    runs-on: ubuntu-latest
    environment: prod

    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor-package
          path: package

      - name: Replace Vendor tfvars
        run: |
          cp \
            terraform/environments/prod/vendor/ka.tfvars \
            package/terraform/ka.tfvars

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: package/terraform
        run: |
          terraform init \
            -input=false \
            -backend-config=../../terraform/backend-configs/backend-vendor-package-prod.tfbackend

      - name: Terraform Validate
        working-directory: package/terraform
        run: |
          terraform validate

      - name: Terraform Plan
        id: plan
        shell: bash {0}
        working-directory: package/terraform
        run: |
          terraform plan \
            -input=false \
            -detailed-exitcode \
            -var-file=ka.tfvars \
            -out=tfplan

          exitcode=$?

          if [[ "$exitcode" == "1" ]]; then
            echo "Terraform plan failed."
            exit 1
          fi

          if [[ "$exitcode" == "2" ]]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Prod Package
        if: steps.plan.outputs.has-changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vendor-package-prod
          path: package
          if-no-files-found: error
          retention-days: 1

      - name: Upload Prod Terraform Plan
        if: steps.plan.outputs.has-changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-prod
          path: package/terraform/tfplan
          if-no-files-found: error
          retention-days: 1

      - name: Create Prod Plan Summary
        if: always() && steps.plan.outcome == 'success'
        shell: bash
        working-directory: package/terraform
        env:
          HAS_CHANGES: ${{ steps.plan.outputs.has-changes }}
          VERSION: ${{ needs.prepare-package.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$HAS_CHANGES" == "false" ]]; then
            {
              echo "## Terraform Plan Summary - Prod"
              echo
              echo "✅ No infrastructure changes detected."
              echo
              echo "**Apply:** Skipped"
              echo
              echo "**Version:** \`$VERSION\`"
              echo
              echo "**Environment:** \`prod\`"
              echo
              echo "**Actor:** @$GITHUB_ACTOR"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          tfplan="$(terraform show -no-color tfplan)"

          plan_summary="$(echo "$tfplan" | tail -2)"
          plan_import="$(echo "$plan_summary" | grep -oE '[0-9]+ to import' | grep -oE '[0-9]+' || echo "0")"
          plan_add="$(echo "$plan_summary" | grep -oE '[0-9]+ to add' | grep -oE '[0-9]+' || echo "0")"
          plan_change="$(echo "$plan_summary" | grep -oE '[0-9]+ to change' | grep -oE '[0-9]+' || echo "0")"
          plan_destroy="$(echo "$plan_summary" | grep -oE '[0-9]+ to destroy' | grep -oE '[0-9]+' || echo "0")"

          {
            echo "## Terraform Plan Summary - Prod"
            echo
            echo "| Add ➕ | Change 🔄 | Destroy 🗑️ | Import 📥 |"
            echo "|---|---|---|---|"
            echo "| $plan_add | $plan_change | $plan_destroy | $plan_import |"
            echo
            echo "<details>"
            echo "<summary>Show Plan</summary>"
            echo
            echo '```terraform'
            echo "$tfplan"
            echo '```'
            echo
            echo "</details>"
            echo
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              echo "**Apply:** Skipped - plan only on pull requests"
            else
              echo "**Apply:** Pending"
            fi
            echo
            echo "**Version:** \`$VERSION\`"
            echo
            echo "**Environment:** \`prod\`"
            echo
            echo "**Actor:** @$GITHUB_ACTOR"
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-apply-test:
    name: Terraform Apply - Test
    needs: terraform-plan-test
    if: |
      needs.terraform-plan-test.outputs.has-changes == 'true'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Test Package
        uses: actions/download-artifact@v4
        with:
          name: vendor-package-test
          path: package

      - name: Download Test Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-test
          path: package/terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: package/terraform
        run: |
          terraform init \
            -input=false \
            -backend-config=../../terraform/backend-configs/backend-vendor-package-test.tfbackend

      - name: Terraform Apply
        working-directory: package/terraform
        run: |
          terraform apply \
            -input=false \
            tfplan

  terraform-apply-prod:
    name: Terraform Apply - Prod
    needs: terraform-plan-prod
    if: |
      needs.terraform-plan-prod.outputs.has-changes == 'true'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Prod Package
        uses: actions/download-artifact@v4
        with:
          name: vendor-package-prod
          path: package

      - name: Download Prod Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-prod
          path: package/terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: package/terraform
        run: |
          terraform init \
            -input=false \
            -backend-config=../../terraform/backend-configs/backend-vendor-package-prod.tfbackend

      - name: Terraform Apply
        working-directory: package/terraform
        run: |
          terraform apply \
            -input=false \
            tfplan