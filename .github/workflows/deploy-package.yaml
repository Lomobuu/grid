name: Deploy Vendor Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "1.0.0"
        required: true
        type: string

      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - test
          - prod

permissions:
  id-token: write
  contents: read

env:
  STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
  CONTAINER_NAME: vendor-packages

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}

      - name: Download Package
        shell: bash
        run: |
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --container-name "$CONTAINER_NAME" \
            --name "${{ inputs.version }}.zip" \
            --file package.zip \
            --auth-mode login

      - name: Extract Package
        shell: bash
        run: |
          rm -rf package
          mkdir -p package

          unzip package.zip -d package

      - name: Copy Environment tfvars
        shell: bash
        run: |
          cp terraform/environments/${{ inputs.environment }}/core/ka.tfvars package/terraform/ka.tfvars

      - name: Terraform Init
        working-directory: package/terraform
        run: |
          terraform init

      - name: Terraform Validate
        working-directory: package/terraform
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: package/terraform
        run: |
          terraform plan \
            -var-file=ka.tfvars \
            -out=tfplan

      - name: Terraform Apply
        working-directory: package/terraform
        run: |
          terraform apply \
            -auto-approve \
            tfplan