name: Deploy Vendor Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (example: 1.0.0)"
        required: true
        type: string
        default: "1.0.0"

      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - test
          - prod

permissions:
  id-token: write
  contents: read

env:
  STORAGE_ACCOUNT_NAME: stgridfozzentest
  CONTAINER_NAME: vendor-packages

jobs:
  prepare-package:
    runs-on: ubuntu-latest

    outputs:
      artifact-name: vendor-package

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download package
        run: |
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --container-name $CONTAINER_NAME \
            --name "${{ inputs.version }}.zip" \
            --file package.zip \
            --auth-mode login

      - name: Extract package
        run: |
          mkdir package
          unzip package.zip -d package

      - name: Copy tfvars
        run: |
          cp terraform/environments/${{ inputs.environment }}/core/ka.tfvars package/terraform/ka.tfvars

      - uses: actions/upload-artifact@v4
        with:
          name: vendor-package
          path: package

  deploy:
    needs: prepare-package

    uses: Lomobuu/TFBiS/.github/workflows/terraform.yaml@513b3bd0bbd27ae118d96aa371e4f2f136cda0c3
    with:
      environment: ${{ inputs.environment }}
      working_directory: package/terraform
      terraform_version: ${{ vars.TERRAFORM_VERSION }}
      backend_config: ../../../terraform/backend-configs/backend-${{ inputs.environment }}.tfbackend

    secrets: inherit

    permissions:
      actions: write
      contents: read
      id-token: write