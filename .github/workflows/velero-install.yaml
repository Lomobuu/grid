name: Deploy Velero to AKS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-kappa-test-weu
  LOCATION: westeurope
  CLUSTER_NAME: aksfozzen3cd99e72959d692e

  BACKUP_RG: rg-kappa-test-weu
  STORAGE_ACCOUNT: stfozzen3cd99e72959d692e
  BLOB_CONTAINER: velero
  VELERO_NAMESPACE: velero

jobs:
  deploy-velero:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group (if missing)
        run: |
          az group create \
            --name "$BACKUP_RG" \
            --location "$LOCATION"

      - name: Create storage account (if missing)
        run: |
          if az storage account show \
            --name "$STORAGE_ACCOUNT" \
            --resource-group "$BACKUP_RG" > /dev/null 2>&1; then
            echo "Storage account already exists."
          else
            az storage account create \
              --name "$STORAGE_ACCOUNT" \
              --resource-group "$BACKUP_RG" \
              --location "$LOCATION" \
              --sku Standard_GRS \
              --kind StorageV2 \
              --min-tls-version TLS1_2 \
              --https-only true \
              --allow-blob-public-access false
          fi

      - name: Create blob container for Velero
        run: |
          az storage container-rm create \
            --storage-account "$STORAGE_ACCOUNT" \
            --name "$BLOB_CONTAINER" \
            --resource-group "$BACKUP_RG" || true

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Create Velero credentials secret
        run: |
          cat > credentials-velero <<EOF
          AZURE_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID=${{ secrets.VELERO_CLIENT_ID }}
          AZURE_CLIENT_SECRET=${{ secrets.VELERO_CLIENT_SECRET }}
          AZURE_RESOURCE_GROUP=${BACKUP_RG}
          AZURE_CLOUD_NAME=AzurePublicCloud
          EOF

          kubectl create namespace ${VELERO_NAMESPACE} \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl delete secret cloud-credentials \
            -n ${VELERO_NAMESPACE} \
            --ignore-not-found=true

          kubectl create secret generic cloud-credentials \
            -n ${VELERO_NAMESPACE} \
            --from-file cloud=credentials-velero

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Velero Helm repo
        run: |
          helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
          helm repo update

      - name: Install / upgrade Velero
        run: |
          helm upgrade --install velero vmware-tanzu/velero \
            --namespace $VELERO_NAMESPACE \
            --create-namespace \
            -f velero/values.yaml \
            --set credentials.useSecret=true \
            --set credentials.existingSecret=cloud-credentials \
            --set configuration.backupStorageLocation[0].bucket=$BLOB_CONTAINER \
            --set configuration.backupStorageLocation[0].config.resourceGroup=$BACKUP_RG \
            --set configuration.backupStorageLocation[0].config.storageAccount=$STORAGE_ACCOUNT \
            --wait