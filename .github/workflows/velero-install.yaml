name: Deploy Velero to AKS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: velero-install
  cancel-in-progress: false

jobs:
  deploy-test:
    name: Deploy Velero (test)
    runs-on: ubuntu-latest
    environment: test

    # ---- Test settings: edit these ----
    env:
      RESOURCE_GROUP: rg-kappa-test-weu # resource group of the AKS cluster
      CLUSTER_NAME: aksfozzen3cd99e72959d692e # Test aks cluster name
      BACKUP_RG: rg-kappa-test-weu # resource group of the storage account
      STORAGE_ACCOUNT: stfozzenvelerotest
      BLOB_CONTAINER: velero
      VELERO_NAMESPACE: velero

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Create Velero credentials secret
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          VELERO_CLIENT_ID: ${{ secrets.VELERO_CLIENT_ID }}
          VELERO_CLIENT_SECRET: ${{ secrets.VELERO_CLIENT_SECRET }}
        run: |
          # Remove the credentials file from the runner when this step ends
          trap 'rm -f credentials-velero' EXIT

          cat > credentials-velero <<EOF
          AZURE_SUBSCRIPTION_ID=${SUBSCRIPTION_ID}
          AZURE_TENANT_ID=${TENANT_ID}
          AZURE_CLIENT_ID=${VELERO_CLIENT_ID}
          AZURE_CLIENT_SECRET=${VELERO_CLIENT_SECRET}
          AZURE_RESOURCE_GROUP=${BACKUP_RG}
          AZURE_CLOUD_NAME=AzurePublicCloud
          EOF

          kubectl create namespace "${VELERO_NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl delete secret cloud-credentials \
            -n "${VELERO_NAMESPACE}" \
            --ignore-not-found=true

          kubectl create secret generic cloud-credentials \
            -n "${VELERO_NAMESPACE}" \
            --from-file cloud=credentials-velero

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Velero Helm repo
        run: |
          helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
          helm repo update

      - name: Install / upgrade Velero
        run: |
          helm upgrade --install velero vmware-tanzu/velero \
            --namespace "$VELERO_NAMESPACE" \
            --create-namespace \
            -f velero/values.yaml \
            --set credentials.useSecret=true \
            --set credentials.existingSecret=cloud-credentials \
            --set "configuration.backupStorageLocation[0].bucket=$BLOB_CONTAINER" \
            --set "configuration.backupStorageLocation[0].config.resourceGroup=$BACKUP_RG" \
            --set "configuration.backupStorageLocation[0].config.storageAccount=$STORAGE_ACCOUNT" \
            --wait

  deploy-prod:
    name: Deploy Velero (prod)
    needs: deploy-test # only runs if the test deployment succeeded
    runs-on: ubuntu-latest
    environment: prod

    # ---- Prod settings: edit these ----
    env:
      RESOURCE_GROUP: CHANGE-ME # resource group of the AKS cluster
      CLUSTER_NAME: CHANGE-ME
      BACKUP_RG: CHANGE-ME # resource group of the storage account
      STORAGE_ACCOUNT: stfozzenveleroprod
      BLOB_CONTAINER: velero
      VELERO_NAMESPACE: velero

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The storage account and its role assignments are created by Terraform.
      # Remove this step if Terraform also creates the container.
      - name: Create blob container for Velero (if missing)
        run: |
          if az storage container-rm show \
            --storage-account "$STORAGE_ACCOUNT" \
            --name "$BLOB_CONTAINER" \
            --resource-group "$BACKUP_RG" > /dev/null 2>&1; then
            echo "Container already exists."
          else
            az storage container-rm create \
              --storage-account "$STORAGE_ACCOUNT" \
              --name "$BLOB_CONTAINER" \
              --resource-group "$BACKUP_RG"
          fi

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Create Velero credentials secret
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          VELERO_CLIENT_ID: ${{ secrets.VELERO_CLIENT_ID }}
          VELERO_CLIENT_SECRET: ${{ secrets.VELERO_CLIENT_SECRET }}
        run: |
          # Remove the credentials file from the runner when this step ends
          trap 'rm -f credentials-velero' EXIT

          cat > credentials-velero <<EOF
          AZURE_SUBSCRIPTION_ID=${SUBSCRIPTION_ID}
          AZURE_TENANT_ID=${TENANT_ID}
          AZURE_CLIENT_ID=${VELERO_CLIENT_ID}
          AZURE_CLIENT_SECRET=${VELERO_CLIENT_SECRET}
          AZURE_RESOURCE_GROUP=${BACKUP_RG}
          AZURE_CLOUD_NAME=AzurePublicCloud
          EOF

          kubectl create namespace "${VELERO_NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl delete secret cloud-credentials \
            -n "${VELERO_NAMESPACE}" \
            --ignore-not-found=true

          kubectl create secret generic cloud-credentials \
            -n "${VELERO_NAMESPACE}" \
            --from-file cloud=credentials-velero

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Velero Helm repo
        run: |
          helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
          helm repo update

      - name: Install / upgrade Velero
        run: |
          helm upgrade --install velero vmware-tanzu/velero \
            --namespace "$VELERO_NAMESPACE" \
            --create-namespace \
            -f velero/values.yaml \
            --set credentials.useSecret=true \
            --set credentials.existingSecret=cloud-credentials \
            --set "configuration.backupStorageLocation[0].bucket=$BLOB_CONTAINER" \
            --set "configuration.backupStorageLocation[0].config.resourceGroup=$BACKUP_RG" \
            --set "configuration.backupStorageLocation[0].config.storageAccount=$STORAGE_ACCOUNT" \
            --wait