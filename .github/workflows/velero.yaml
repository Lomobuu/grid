name: Deploy Velero to AKS

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  RESOURCE_GROUP: rg-kappa-test-weu
  LOCATION: norwayeast
  CLUSTER_NAME: aksfozzen3cd99e72959d692e
  BACKUP_RG: rg-kappa-test-weu
  STORAGE_ACCOUNT: stfozzen3cd99e72959d692e
  BLOB_CONTAINER: velero
  VELERO_NAMESPACE: velero

jobs:
  deploy-velero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group (if missing)
        run: |
          az group create \
            --name "$BACKUP_RG" \
            --location "$LOCATION"

      - name: Create storage account (if missing)
        run: |
          if az storage account show --name "$STORAGE_ACCOUNT" --resource-group "$BACKUP_RG" >/dev/null 2>&1; then
            echo "Storage account $STORAGE_ACCOUNT already exists, skipping."
          else
            az storage account create \
              --name "$STORAGE_ACCOUNT" \
              --resource-group "$BACKUP_RG" \
              --location "$LOCATION" \
              --sku Standard_GRS \
              --kind StorageV2 \
              --min-tls-version TLS1_2 \
              --https-only true \
              --allow-blob-public-access false
          fi

      - name: Create blob container for Velero
        run: |
          az storage container-rm create \
            --storage-account "$STORAGE_ACCOUNT" \
            --name "$BLOB_CONTAINER" \
            --resource-group "$BACKUP_RG"

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Velero Helm repo
        run: |
          helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
          helm repo update

      - name: Install / upgrade Velero
        run: |
          helm upgrade --install velero vmware-tanzu/velero \
            --namespace $VELERO_NAMESPACE --create-namespace \
            -f velero/values.yaml \
            --set configuration.backupStorageLocation[0].bucket=$BLOB_CONTAINER \
            --set configuration.backupStorageLocation[0].config.resourceGroup=$BACKUP_RG \
            --set configuration.backupStorageLocation[0].config.storageAccount=$STORAGE_ACCOUNT \
            --wait