initContainers:
  - name: velero-plugin-for-microsoft-azure
    image: velero/velero-plugin-for-microsoft-azure:v1.10.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

credentials:
  useSecret: true
  existingSecret: cloud-credentials

configuration:
  backupStorageLocation:
    - name: default
      provider: azure
      bucket: velero
      config: {}

  volumeSnapshotLocation:
    - name: default
      provider: azure
      config: {}

serviceAccount:
  server: {}

schedules:
  daily:
    schedule: "0 2 * * *"
    template:
      ttl: "168h"
      includedNamespaces:
        - "*"
